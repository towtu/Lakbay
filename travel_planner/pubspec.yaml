name: travel_planner
description: "A new Flutter project."
publish_to: 'none' 

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter

  # Icons for iOS
  cupertino_icons: ^1.0.8
  
  # Backend
  supabase_flutter: ^2.12.0
  
  # --- NEW MAP FEATURES ---
  flutter_map: ^6.0.0       # The Free Map (OpenStreetMap)
  latlong2: ^0.9.0          # Helper for Coordinates
  url_launcher: ^6.2.0      # Opens Google Maps for Directions
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  http: ^1.1.0
  intl: ^0.18.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Your Images
  assets:
    - assets/lakbay.png